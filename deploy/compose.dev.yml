# Local Postgres for cna-server's tests and dev runs:
#   docker compose -f deploy/compose.dev.yml up -d db
#   DATABASE_URL=postgres://cna:cna@localhost:5433/cna
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cna
      POSTGRES_PASSWORD: cna
      POSTGRES_DB: cna
    ports:
      - "5433:5432"
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker.
      - cna-db:/var/lib/postgresql

volumes:
  cna-db:
