name: Build

# A v* tag tests the commit with this repo's ci.yml, then builds ghcr.io/basmith7/cna:<tag>
# and :latest; nothing deploys on its own. Deploy with `deploy-now <tag>` (tower-deploy). The
# image job is shared: https://github.com/basmith7/workflows
# It checks out without submodules, so the Dockerfile fetches vendor/cna itself at the commit
# the `rules` job reads from the tree.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
  rules:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - id: commit
        run: echo "commit=$(git rev-parse HEAD:vendor/cna)" >> "$GITHUB_OUTPUT"
  image:
    needs: [test, rules]
    uses: basmith7/workflows/.github/workflows/build-image.yml@main
    with:
      image: cna
      build-args: CNA_RULES_COMMIT=${{ needs.rules.outputs.commit }}
    permissions:
      contents: read
      packages: write
