[workspace]
resolver = "3"
members = ["crates/cna-data", "crates/cna-rules", "crates/cna-probe", "crates/cna-game"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand_chacha = "0.3"
rand_core = "0.6"
